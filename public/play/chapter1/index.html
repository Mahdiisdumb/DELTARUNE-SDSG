<body oncontextmenu="return false;">

    <script src="../play/loader.js"></script>
    <script>
        window.save_transfer_backend_config = {
            endpoint: `${window.location.origin}/keys`,
            createPath: "/api/codes",

            timeoutMs: 3500,
        };

    <script src="../../setup/savetransfer.js"></script>

    <style id="save-manager-vinetrap-ui-fixes">

    <body>
        <div id="loadah">
              <img src="../spr/tobyload.gif" id="tobyload" alt="Loading Toby Fox">
              <div id="progressbar-container">
                <div id="progressbar"></div>
              </div>
              <div id="loadahstatus">Initializing...</div>
            </div>
        <div id="game-container">
            <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
            <div class="loading">
                <div class="spinner" id="spinner"></div>
                <noscript class="nsmessage">This requires JavaScript and WebAssembly to be enabled in your browser.</noscript>
                <div class="emscripten" id="status">Loading...</div>
                <progress value="0" max="100" id="progress" hidden="1"></progress>
            </div>
            <div id="mobile-controls">
                <div id="joystick-zone"></div>
                <div id="button-zone">
                    <img class="action-button" id="button-c" alt="C Button">
                    <img class="action-button" id="button-x" alt="X Button">
                    <img class="action-button" id="button-z" alt="Z Button">
                    <div id="dpad-container"></div>
                </div>
            </div>
            <div class="output-container" id="output-container" aria-hidden="true">
                <section class="vine-menu-panel" role="dialog" aria-modal="true" aria-labelledby="vine-menu-title">
                    <button id="closeUIButton" onclick="hideUI()" aria-label="Close menu">&times;</button>
                    <h2 class="vine-menu-title" id="vine-menu-title">WinMenu</h2>
                    <div class="vine-menu-list" id="vine-menu-list">
                        <div class="vine-menu-soul" id="vine-menu-soul" aria-hidden="true"></div>
                        <div id="mobile-buttons" class="vine-menu-group">
                            <button class="output-button vine-menu-option" onclick="window.enterPositionMode()" title="Enter Positioning Mode to position the on-screen mobile controls">Position Controls?</button>
                            <button class="output-button vine-menu-option" onclick="toggleDpadMode()" title="Toggle between the directional pad and joystick">Toggle D-Pad / Joystick!</button>
                        </div>
                        <button class="output-button vine-menu-option" id="fullscreen" title="Toggle Fullscreen">Toggle Fullscreen?</button>
                        <button class="output-button vine-menu-option" onclick="toggleConsole()" title="Lists emscripten/GM console output and loading progress">Toggle Console!</button>
                        <button class="output-button vine-menu-option" id="stats-button" onclick="toggleFPS()" title="Toggles the external FPS Counter">Toggle FPS Counter!</button>
                        <button class="output-button vine-menu-option" onclick="window.SAVEManager.openSAVEManager()" title="Manage your DELTARUNE SAVE files">SAVE Manager!</button>
                        <button class="output-button vine-menu-option" id="colorpicker-trigger" onclick="openBorderColorPicker()" title="Changes color of the canvas' surrounding areas">Change Border Color?</button>
                    </div>

            <div class="custom-message-box-content">
                <p id="messageBoxText"></p>
                <button id="messageBoxConfirmBtn">OK</button>
            </div>
        </div>
        <div id="saveManagerModal" class="save-manager-modal">
            <div class="save-manager-content">
                <span class="close-button" onclick="window.SAVEManager.closeSAVEManager()">&times;</span>
                <div class="save-manager-content2">
                    <span class="minimize-button" onclick="window.SAVEManager.closeSMnoreload()">&dash;</span>
                    <button class="output-button" onclick="toggleclear_site_cache()">Wipe all of your SAVEs?</button>
                    <button id="exportAllBtn" class="output-button" onclick="SAVEManager.exportAllToZip()">Export all SAVEs to ZIP?</button>
                    <h3>Current SAVE Files:</h3>
                    <div id="saveFileList" class="save-file-list">
                        <p style="text-align: center; color: #888;">No saves found. Try importing one or saving in-game first.</p>
                    </div>
                    <div class="save-code-section">
                        <h3 class="save-code-title">SAVE Code Transfer</h3>
                        <p class="save-code-status" id="saveCodeStatus" aria-live="polite">Generate a shortcode from your current SAVEs, or paste one to import.</p>
                        <textarea id="saveCodeInput" class="save-manager-focusable" spellcheck="false" autocomplete="off" autocapitalize="characters" placeholder="Enter your shortcode, or click Generate Code for yours to show up here."></textarea>
                        <div class="save-code-actions">
                            <button type="button" class="save-manager-focusable" onclick="SAVEManager.importSaveCodeFromText()">Import Code?</button>
                            <button type="button" class="save-manager-focusable" onclick="SAVEManager.generateSaveCode()">Generate Code?</button>
                            <button type="button" class="save-manager-focusable" onclick="SAVEManager.copySaveCode()">Copy Code?</button>
                        </div>
                    </div>
                    <div class="file-upload-section">
                        <h3>Import Save Files?</h3>
                        <input type="file" id="uploadFileInput" accept="*" multiple>
                        <input type="text" id="uploadFileNameInput" placeholder="Enter the corresponding filename (e.g., filech1_0, dr.ini / for single file only)">
                        <button onclick="SAVEManager.handleUpload()">Select File(s)!</button>
                    </div>
                </div>
            </div>
            <script>
                window.addEventListener('load', () => {
                    const mobileButtons = document.getElementById('mobile-buttons');
                    if (mobileButtons && /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                        mobileButtons.style.display = 'flex';
                    }
                    window.vine_menu?.refresh?.();
                });
            </script>
            
            <style id="save-manager-controller-style">
                #saveManagerModal .save-manager-controller-selected,
                #saveManagerModal button:focus,
                #saveManagerModal input:focus,
                #saveManagerModal textarea:focus,
                #customMessageBox button:focus {
                    outline: 3px solid #ffff00 !important;
                    outline-offset: 3px !important;
                    box-shadow: 0 0 0 2px #000, 0 0 12px rgba(255, 255, 0, 0.85) !important;
                }
                #saveManagerModal .save-manager-controller-selected::before {
                    content: "♥ ";
                    color: #ff0000;
                    -webkit-text-fill-color: #ff0000;
                }
            </style>
<script>
                window.SAVEManager = (function() {
                    function showMessageBox(message, onConfirm = null) {
                        const messageBox = document.getElementById('customMessageBox');
                        const messageBoxText = document.getElementById('messageBoxText');
                        const messageBoxConfirmBtn = document.getElementById('messageBoxConfirmBtn');
                        const messageBoxCancelBtn = document.getElementById('messageBoxCancelBtn');
                        messageBoxText.textContent = message;
                        messageBoxConfirmBtn.textContent = 'Alright!';
                        if (messageBoxCancelBtn) {
                            messageBoxCancelBtn.style.display = 'none';
                        }
                        messageBox.style.display = 'flex';
                        messageBoxConfirmBtn.onclick = () => {
                            messageBox.style.display = 'none';
                            if (onConfirm) onConfirm();
                        };
                    }

                    function confirmBox(message) {
                        return new Promise((resolve) => {
                            const messageBox = document.getElementById('customMessageBox');
                            const messageBoxText = document.getElementById('messageBoxText');
                            const messageBoxConfirmBtn = document.getElementById('messageBoxConfirmBtn');
                            let messageBoxCancelBtn = document.getElementById('messageBoxCancelBtn');
                            if (!messageBoxCancelBtn) {
                                messageBoxCancelBtn = document.createElement('button');
                                messageBoxCancelBtn.id = 'messageBoxCancelBtn';
                                messageBoxCancelBtn.style.backgroundColor = '#6c757d';
                                messageBoxCancelBtn.style.marginLeft = '10px';
                                messageBoxConfirmBtn.parentNode.appendChild(messageBoxCancelBtn);
                            }
                            messageBoxText.textContent = message;
                            messageBoxConfirmBtn.textContent = 'Sure!';
                            messageBoxCancelBtn.textContent = 'Nah.';
                            messageBoxCancelBtn.style.display = 'inline-block';
                            messageBox.style.display = 'flex';
                            messageBoxConfirmBtn.onclick = () => {
                                messageBox.style.display = 'none';
                                resolve(true);
                            };
                            messageBoxCancelBtn.onclick = () => {
                                messageBox.style.display = 'none';
                                resolve(false);
                            };
                        });
                    }
                    const DB_NAME = '/_savedata';
                    const STORE_NAME = 'FILE_DATA';
                    const DB_VERSION = 21;
                    let db;
                    async function openIndexedDB() {
                        if (db) return db;
                        if (!window.indexedDB) {
                            showMessageBox("Your browser doesn't support IndexedDB. The SAVE Manager will not work.");
                            throw new Error("IndexedDB not supported ðŸ˜‚ no saves for you gng");
                        }
                        const databases = await window.indexedDB.databases();
                        const dbExists = databases.some(dbInfo => dbInfo.name === DB_NAME);
                        if (!dbExists) {
                            const errorMessage = `Database '${DB_NAME}' not found. Please SAVE in-game first!`;
                            console.log(errorMessage);
                            throw new Error(errorMessage);
                        }
                        return new Promise((resolve, reject) => {
                            const request = indexedDB.open(DB_NAME, DB_VERSION);
                            request.onerror = (event) => {
                                console.error("IndexedDB error:", event.target.error);
                                showMessageBox("Error opening IndexedDB: " + (event.target.error ? event.target.error.message : "Unknown error??"));
                                reject("Error opening IndexedDB!");
                            };
                            request.onsuccess = (event) => {
                                db = event.target.result;
                                console.log("IndexedDB opened successfully.");
                                resolve(db);
                            };
                            request.onupgradeneeded = (event) => {
                                db = event.target.result;
                                if (!db.objectStoreNames.contains(STORE_NAME)) {
                                    console.log(`Object store '${STORE_NAME}' not found. Waiting for the game to create it... smh`);
                                }
                            };
                        });
                    }
                    async function getSaveFiles() {
                        try {
                            await openIndexedDB();
                            const transaction = db.transaction([STORE_NAME], 'readonly');
                            const objectStore = transaction.objectStore(STORE_NAME);
                            const request = objectStore.getAll();
                            return new Promise((resolve, reject) => {
                                request.onsuccess = (event) => {
                                    const files = event.target.result;
                                    const fileNamesRequest = objectStore.getAllKeys();
                                    fileNamesRequest.onsuccess = (eventKeys) => {
                                        const fileNames = eventKeys.target.result;
                                        const result = files.map((file, index) => ({
                                            name: fileNames[index],
                                            data: file
                                        }));
                                        resolve(result);
                                    };
                                    fileNamesRequest.onerror = (eventKeys) => {
                                        console.error("Error getting file names:", eventKeys.target.error);
                                        reject("Error getting file names: " + (eventKeys.target.error ? eventKeys.target.error.message : "Unknown error"));
                                    };
                                };
                                request.onerror = (event) => {
                                    console.error("Error getting save files from object store:", event.target.error);
                                    reject("Error getting save files: " + (event.target.error ? event.target.error.message : "Unknown error"));
                                };
                            });
                        } catch (error) {
                            console.error("Error in getSaveFiles:", error);
                            showMessageBox("Failed to retrieve save files: " + error.message);
                            return [];
                        }
                    }
                    async function displaySaveFiles() {
                        const saveFileListDiv = document.getElementById('saveFileList');
                        saveFileListDiv.innerHTML = '';
                        try {
                            const files = await getSaveFiles();
                            if (files.length === 0) {
                                saveFileListDiv.innerHTML = 'No saves found. Try importing one or saving in-game first.';
                                return;
                            }
                            files.forEach(fileEntry => {
                                const fileName = fileEntry.name;
                                const fileData = fileEntry.data;
                                const itemDiv = document.createElement('div');
                                itemDiv.classList.add('save-file-item');
                                const infoDiv = document.createElement('div');
                                infoDiv.classList.add('save-file-info');
                                const timestamp = fileData.timestamp ? new Date(fileData.timestamp).toLocaleString() : 'N/A';
                                const size = fileData.contents ? fileData.contents.byteLength : 0;
                                infoDiv.innerHTML = `
                  
                      
                      
                                  
                                                <span>
                                                    <strong>File:</strong> ${fileName.replace('/_savedata/', '')}
                      
                      
                                  
                                                </span>
                                                <span>
                                                    <strong>Last Modified:</strong> ${timestamp}
                      
                      
                                  
                                                </span>
                                                <span>
                                                    <strong>Size:</strong> ${size} bytes
                      
                      
                                  
                                                </span>
                `;
                                const actionsDiv = document.createElement('div');
                                actionsDiv.classList.add('save-file-actions');
                                const downloadBtn = document.createElement('button');
                                downloadBtn.textContent = 'Download';
                                downloadBtn.onclick = () => downloadSaveFile(fileName, fileData.contents);
                                actionsDiv.appendChild(downloadBtn);
                                const deleteBtn = document.createElement('button');
                                deleteBtn.textContent = 'Delete';
                                deleteBtn.classList.add('delete-btn');
                                deleteBtn.onclick = async () => {
                                    const confirmed = await confirmBox(`Are you sure you want to delete "${fileName}"?`);
                                    if (confirmed) {
                                        await deleteSaveFile(fileName);
                                    }
                                };
                                actionsDiv.appendChild(deleteBtn);
                                itemDiv.appendChild(infoDiv);
                                itemDiv.appendChild(actionsDiv);
                                saveFileListDiv.appendChild(itemDiv);
                            });
                        } catch (error) {
                            console.error("Error displaying save files:", error);
                            saveFileListDiv.innerHTML = `
                                  
                                  
                                  
                                                <p style="text-align: center; color: #FA1E4E;">Error loading files: ${error.message}</p>`;
                        }
                    }

                    function downloadSaveFile(fileName, contents) {
                        if (!contents) {
                            showMessageBox("No content to download for this file!");
                            return;
                        }
                        const blob = new Blob([contents], {
                            type: 'application/octet-stream'
                        });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        showMessageBox(`File "${fileName}" downloaded.`);
                    }
                    async function deleteSaveFile(fileName) {
                        try {
                            await openIndexedDB();
                            const transaction = db.transaction([STORE_NAME], 'readwrite');
                            const objectStore = transaction.objectStore(STORE_NAME);
                            const request = objectStore.delete(fileName);
                            return new Promise((resolve, reject) => {
                                request.onsuccess = () => {
                                    showMessageBox(`File "${fileName}" deleted successfully.`);
                                    displaySaveFiles();
                                    resolve();
                                };
                                request.onerror = (event) => {
                                    console.error("Error deleting file:", event.target.error);
                                    showMessageBox(`Error deleting file "${fileName}": ` + (event.target.error ? event.target.error.message : "Unknown error"));
                                    reject("Error deleting file.");
                                };
                            });
                        } catch (error) {
                            console.error("Error in deleteSaveFile:", error);
                            showMessageBox("Failed to delete save file: " + error.message);
                        }
                    }
                    async function handleUpload() {
                        const uploadFileInput = document.getElementById('uploadFileInput');
                        const uploadFileNameInput = document.getElementById('uploadFileNameInput');
                        const files = uploadFileInput.files;
                        if (files.length === 0) {
                            showMessageBox("Please select at least one file to upload.");
                            return;
                        }
                        try {
                            const uploadPromises = [];
                            for (let i = 0; i < files.length; i++) {
                                const file = files[i];
                                let fileName = (files.length === 1 && uploadFileNameInput.value.trim()) ? uploadFileNameInput.value.trim() : file.name;
                                fileName = fileName.replace(/^_savedata\//, '');
                                fileName = fileName.replace(/^\//, '');
                                if (!fileName) {
                                    showMessageBox(`Invalid file name for "${file.name}" after processing. Skipping.`);
                                    continue;
                                }
                                const arrayBuffer = await file.arrayBuffer();
                                const uint8ArrayContents = new Uint8Array(arrayBuffer);
                                const saveObject = {
                                    timestamp: new Date(),
                                    mode: 33206,
                                    contents: uint8ArrayContents
                                };
                                const finalFileName = `/_savedata/${fileName}`;
                                uploadPromises.push(saveSaveFile(finalFileName, saveObject));
                            }
                            await Promise.all(uploadPromises);
                            showMessageBox(`${files.length} file(s) uploaded and saved successfully.`);
                            uploadFileInput.value = '';
                            uploadFileNameInput.value = '';
                            displaySaveFiles();
                        } catch (error) {
                            console.error("Error uploading file(s):", error);
                            showMessageBox("Failed to upload one or more files: " + error.message);
                        }
                    }
                    async function exportAllToZip() {
                        try {
                            const files = await getSaveFiles();
                            if (files.length === 0) {
                                showMessageBox("No save files to export.");
                                return;
                            }
                            const zip = new JSZip();
                            files.forEach(fileEntry => {
                                const fileName = fileEntry.name.replace(/^\/_savedata\//, '');
                                const contents = fileEntry.data.contents;
                                if (contents) {
                                    const zipContents = (contents instanceof Int8Array) ? new Uint8Array(contents.buffer) : contents;
                                    zip.file(fileName, zipContents);
                                }
                            });
                            const zipBlob = await zip.generateAsync({
                                type: 'blob'
                            });
                            const url = URL.createObjectURL(zipBlob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'Project Vinetrap_SAVEs.zip';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                            showMessageBox("All save files exported to Project Vinetrap_SAVEs.zip.");
                        } catch (error) {
                            console.error("Error exporting to ZIP:", error);
                            showMessageBox("Failed to export to ZIP: " + error.message);
                        }
                    }

                    function getSaveTransferCodec() {
                        return window.save_transfer_codec || window.saveTransferCodec || null;
                    }
                    async function loadScriptOnce(src, marker) {
                        if (document.querySelector(`script[data-save-manager-loader="${marker}"]`)) {
                            return new Promise((resolve) => setTimeout(resolve, 0));
                        }
                        await new Promise((resolve, reject) => {
                            const script = document.createElement('script');
                            script.src = src;
                            script.dataset.saveManagerLoader = marker;
                            script.onload = resolve;
                            script.onerror = reject;
                            document.head.appendChild(script);
                        });
                    }
                    async function ensureSaveTransferCodec() {
                        let codec = getSaveTransferCodec();
                        if (codec?.decodeCode && (codec.buildBestCodeFromRecords || codec.buildCodeFromRecords)) {
                            return codec;
                        }
                        if (!window.save_transfer_backend_config && !window.saveTransferBackendConfig) {
                            try { await loadScriptOnce('../../setup/savetransfer.js', 'savetransfer'); } catch (_error) {}
                        }
                        try { await loadScriptOnce('../../setup/savecodec.js', 'savecodec'); } catch (_error) {}
                        codec = getSaveTransferCodec();
                        return codec?.decodeCode && (codec.buildBestCodeFromRecords || codec.buildCodeFromRecords) ? codec : null;
                    }
                    function setSaveCodeStatus(message, type = "") {
                        const status = document.getElementById('saveCodeStatus');
                        if (!status) return;
                        status.textContent = message || "";
                        status.classList.toggle('ok', type === 'ok');
                        status.classList.toggle('error', type === 'error');
                    }
                    function normalizeSaveRecordName(fileName) {
                        return String(fileName || '').replace(/^\/_savedata\//, '').replace(/^_savedata\//, '').replace(/^\//, '');
                    }
                    async function getSaveRecordsForCode() {
                        const files = await getSaveFiles();
                        return files
                            .filter(fileEntry => fileEntry && fileEntry.data && fileEntry.data.contents)
                            .map(fileEntry => ({
                                name: normalizeSaveRecordName(fileEntry.name),
                                timestampMs: fileEntry.data.timestamp ? new Date(fileEntry.data.timestamp).getTime() : Date.now(),
                                mode: fileEntry.data.mode || 33206,
                                contents: fileEntry.data.contents instanceof Uint8Array
                                    ? fileEntry.data.contents
                                    : new Uint8Array(fileEntry.data.contents)
                            }));
                    }
                    async function generateSaveCode() {
                        const codec = await ensureSaveTransferCodec();
                        const input = document.getElementById('saveCodeInput');
                        if (!codec || (!codec.buildBestCodeFromRecords && !codec.buildCodeFromRecords)) {
                            setSaveCodeStatus('SAVE code tools are unavailable.', 'error');
                            return;
                        }
                        try {
                            setSaveCodeStatus('Building SAVE code...', 'ok');
                            const records = await getSaveRecordsForCode();
                            if (!records.length) {
                                setSaveCodeStatus('No SAVE files found to encode.', 'error');
                                return;
                            }
                            const result = codec.buildBestCodeFromRecords
                                ? await codec.buildBestCodeFromRecords(records)
                                : { code: await codec.buildCodeFromRecords(records), mode: 'raw' };
                            if (input) {
                                input.value = result.code || result.rawCode || '';
                                input.focus();
                                input.select();
                            }
                            setSaveCodeStatus(result.mode === 'short' ? 'Shortcode generated! It expires in 30 days.' : 'Raw SAVE code generated!', 'ok');
                        } catch (error) {
                            console.error('Unable to generate SAVE code:', error);
                            setSaveCodeStatus(error?.message || 'Unable to generate SAVE code.', 'error');
                        }
                    }
                    async function importSaveCodeFromText() {
                        const codec = await ensureSaveTransferCodec();
                        const input = document.getElementById('saveCodeInput');
                        const rawCode = input ? input.value.trim() : '';
                        if (!codec || !codec.decodeCode) {
                            setSaveCodeStatus('SAVE code decoder is unavailable. Please refresh once and try again.', 'error');
                            return;
                        }
                        if (!rawCode) {
                            setSaveCodeStatus('Paste a SAVE code first.', 'error');
                            input?.focus();
                            return;
                        }
                        try {
                            setSaveCodeStatus('Decoding SAVE code...', 'ok');
                            const records = await codec.decodeCode(rawCode);
                            if (!records || !records.length) {
                                throw new Error('That SAVE code did not contain any SAVE files.');
                            }
                            await Promise.all(records.map(record => {
                                const finalFileName = `/_savedata/${normalizeSaveRecordName(record.name)}`;
                                return saveSaveFile(finalFileName, {
                                    timestamp: new Date(record.timestampMs || Date.now()),
                                    mode: record.mode || 33206,
                                    contents: record.contents instanceof Uint8Array ? record.contents : new Uint8Array(record.contents)
                                });
                            }));
                            await displaySaveFiles();
                            setSaveCodeStatus(`${records.length} SAVE file(s) imported from code!`, 'ok');
                            showMessageBox(`${records.length} SAVE file(s) imported from code!`);
                        } catch (error) {
                            console.error('Unable to import SAVE code:', error);
                            setSaveCodeStatus(error?.message || 'Unable to import SAVE code.', 'error');
                        }
                    }
                    async function copySaveCode() {
                        const input = document.getElementById('saveCodeInput');
                        const code = input ? input.value.trim() : '';
                        if (!code) {
                            setSaveCodeStatus('There is no SAVE code to copy yet.', 'error');
                            return;
                        }
                        try {
                            await navigator.clipboard.writeText(code);
                            setSaveCodeStatus('SAVE code covined!', 'ok');
                        } catch (error) {
                            input?.focus();
                            input?.select();
                            setSaveCodeStatus('Could not copy automatically. The code is selected for you.', 'error');
                        }
                    }
                    function getSaveManagerFocusableElements() {
                        const modal = document.getElementById('saveManagerModal');

                        const firefoxRegex = /^([0-9a-fA-F]{4})-([0-9a-fA-F]{4})-(.*)$/;
                        const chromeRegex = /^(.*) ?\(.*[vV][eE][nN][dD][oO][rR]: ?([0-9a-fA-F]{4}).*[pP][rR][oO][dD][uU][cC][tT]: ?([0-9a-fA-F]{4})\)$/;

                        let vendor = undefined;
                        let product = undefined;

                            vendor = firefoxMatch[1];
                            product = firefoxMatch[2];
                        } else {

                            if (chromeMatch) {
                                name = chromeMatch[1];
                                vendor = chromeMatch[2];
                                product = chromeMatch[3];
                            }
                        }
                        if (!name) {
                            name = "";
                        }
                        if (!vendor) {
                            vendor = "";
                        }
                        if (!product) {
